; تنظیمات PHP برای هاست‌هایی که از PHP-FPM استفاده می‌کنند
; اگر هاست این مقادیر را نپذیرد، پنل خودش را با محدودیت‌های واقعی هماهنگ می‌کند
; و آپلود را تکه‌تکه انجام می‌دهد.

upload_max_filesize = 2048M
post_max_size = 2048M
memory_limit = 512M
max_execution_time = 3600
max_input_time = 3600
max_file_uploads = 100

; اخطارها نباید داخل پاسخ‌های JSON چاپ شوند (خطاها در لاگ سرور ثبت می‌شوند)
display_errors = Off
log_errors = On

; چون بدنه‌ی تکه‌ها به‌صورت خام (octet-stream) ارسال می‌شود، این مقدار فقط برای
; فرم‌های معمولی مهم است؛ بالا بردنش جلوی اخطارهای بی‌مورد را می‌گیرد.
max_input_vars = 10000
